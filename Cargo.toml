[package]
name = "rockstar"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
description = "A tiled GPUI workspace for pi chat and source editing"
publish = false

[dependencies]
alacritty_terminal = { version = "0.26", default-features = false }
anyhow = "1"
async-channel = "2"
futures-lite = "2"
gpui-kit = { version = "0.8.1", features = ["tree-sitter-languages"] }
ignore = "0.4"
notify = "8.2"
image = { version = "0.25", default-features = false, features = ["png"] }
html5ever = "0.27"
markup5ever_rcdom = "0.3"
markdown = "1"
data-url = "0.3"
libloading = "0.8"
reqwest = { package = "gpui-pre-reqwest", version = "0.12.15", default-features = false, features = ["blocking", "rustls-tls-native-roots"] }
latex-rust = "3.0.1"
libc = "0.2"
lsp-types = "0.97"
url = "2"
merman = "0.9.3"
portable-pty = "0.9"
roxmltree = "0.21"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
similar = "2.7"

[patch.crates-io]
# Keep X11 IME coordinates updating during composition; see vendor/README.md.
gpui-pre-linux = { path = "vendor/gpui-pre-linux" }
# Native inlay / block annotations without modifying source text.
gpui-base = { path = "vendor/gpui-base" }

[profile.dev]
debug = 1

[profile.release]
strip = "symbols"
