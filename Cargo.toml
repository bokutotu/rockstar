[package]
name = "rockstar"
version = "0.1.0"
edition = "2024"

[dependencies]
crossterm = { version = "0.29.0", features = ["event-stream"] }
lsp-types = "0.97.0"
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
similar = "3.2.0"
tokio = { version = "1.53.1", features = [
    "io-util",
    "macros",
    "process",
    "rt-multi-thread",
    "sync",
    "time",
] }
tree-sitter = "0.27.0"
tree-sitter-haskell = "0.23.1"
tree-sitter-highlight = "0.27.0"
tree-sitter-rust = "0.24.2"
