[package]
name = "rockstar"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
description = "A minimal GPUI Markdown viewer for Linux"
publish = false

[dependencies]
gpui-kit = { version = "0.8.1", features = ["tree-sitter-languages"] }
latex-rust = "3.0.1"
merman = "0.9.3"
roxmltree = "0.21"
serde_json = "1"

[dev-dependencies]
gpui = { package = "gpui-pre", version = "=0.3.10", features = ["test-support"] }
gpui-platform = { package = "gpui-pre-platform", version = "=0.3.10", features = ["test-support"] }
image = { version = "0.25", default-features = false, features = ["png"] }

[profile.dev]
debug = 1

[profile.release]
strip = "symbols"
